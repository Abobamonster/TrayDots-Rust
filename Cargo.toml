[package]
name = "tray-dots-rust"
version = "1.2.1"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_HiDpi",
    "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
